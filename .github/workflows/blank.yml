name: Rust Warfare LoadLab

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LoadLab
        run: python S.py

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rust-Warfare-Report
          path: site_report.json
          if-no-files-found: ignore
